<style>
.t0{width:20px;height:20px;padding:0px;border:0px;}
.t1{width:20px;height:20px;padding:0px;background-color:#fff;}td{border:0px;padding:0px;}
body{margin:0px;}main{margin:8px;margin-top:108px;}
</style>
<img src="headerbg.gif" id="headerbg" style="object-fit:cover;height:100px;width:100dvw;position:fixed;top:0px;">
<main>
<button onclick="rescale(-1)">-</button>
<button onclick="rescale(1)">+</button>
<button onclick="rescale(0)">Refresh!</button>
<button onclick="sizeInput()">Enter Scale</button>
<br><br><wrapper id="game"></wrapper>
<h1 style="margin-bottom:0;">Keybinds</h1>
<div>Plus/minus keys: scale up/down one
<br>R key: refresh board</div>
</main><script>
let cs=3;let left=1;
rescale(0);
function createTable(size){
	var tbody='';left=1;
	for(let i=0;i<size;i++){
		var theader='<div><table border="1">\n';
		tbody+='<tr>';
		for(let j=0;j<size;j++){
			tbody+='<td><button class="t0" id="'+j+','+i+'" onclick="move('+j+','+i+')"></button></td>';
                }
		tbody+='</tr>\n';
	var tfooter='</table></div>';
	document.getElementById('game').innerHTML=theader+tbody+tfooter;
	}
}
function generatePattern(size){
	for(let i=0;i<size;i++){
		for(let j=0;j<size;j++){
			if(Math.round(Math.random())){move(i,j);}
		}
	}left--;
}
function rescale(ds){
	cs=Math.max(2,cs+ds);
	createTable(cs);
	generatePattern(cs);
}
function sizeInput(){
	let temp=0;
	while(temp<2||isNaN(temp)||temp%1>0){temp=Number(prompt("Scale of board?"));}
	cs=temp;
	createTable(cs);
	generatePattern(cs);
}
function move(x,y){
	if(left>0){
		for(let d=0;d<5;d++){
			let tx=x+[0,1,0,-1,0][d];let ty=y+[0,0,1,0,-1][d];
			if(Math.min(tx,ty)<0||Math.max(tx,ty)>=cs){continue;}
			let temp=document.getElementById(tx+','+ty).className[1];left+=1-2*temp;
			document.getElementById(tx+','+ty).className="t"+(1-temp);
		}if(left<1){alert("Solved!");rescale(0);}
	}
}
document.addEventListener("keypress",function(event){
	for(i=0;i<3;i++){if(event.code==["Equal","Minus","KeyR"][i]){rescale([1,-1,0][i]);}}
})
</script>
