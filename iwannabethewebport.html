function aq(rgb){return[Math.max(0,rgb[0]-35),Math.max(0,rgb[1]-35),Math.min(255,rgb[2]+85)]}
function cycle(){
  if(Math.floor(cc/51)==0){g+=5}
  else if(Math.floor(cc/51)==1){r-=5}
  else if(Math.floor(cc/51)==2){b+=5}
  else if(Math.floor(cc/51)==3){g-=5}
  else if(Math.floor(cc/51)==4){r+=5}
  else{b-=5}
  cc+=1;
  cc%=306;
}
function pgcf(n,p,r,g,b){
  fill_rect(64,80,192,96,"0");
  for(i=0;i<16;i++){
    for(j=0;j<32;j++){
      if(Number(level[i][j])==p&&p>0){fill_rect(10*j,10*i,10,10,(r,g,b))}}}
}
function render(cols,level){
  fill_rect(0,0,320,160,cols[0]);
  for(i=0;i<16;i++){
    for(j=0;j<32;j++){
      fill_rect(10*j,10*i,10,10,cols[Number(level[i][j])])}}
}
function gt(x,y){
  if(y>159){return 3}
  if(x<0||x>319||y<0){return 1}
  else{return Number(level[Math.floor(y/10)][Math.floor(x/10)])}
}
function regen(x,y){
  if(x>=0&&x<=31&&y>=0&&y<=15){fill_rect(x*10,y*10,10,10,cols[Number(level[y][x])])}
}

  else if((gt(pos[0],pos[1]+10)==0||gt(pos[0],pos[1]+10)>=3)&&(gt(pos[0]+9,pos[1]+10)==0||gt(pos[0]+9,pos[1]+10)>=3)&&(wb==0||kd[1]==0)){pos[1]+=2}
  if(!kd[1]||(gt(pos[0],pos[1]-1)!=0&&gt(pos[0],pos[1]-1)<3)||(gt(pos[0]+9,pos[1]-1)!=0&&gt(pos[0]+9,pos[1]-1)<3)&&wb==0){frames=0}
  if(gt(pos[0],pos[1])==3||gt(pos[0]+9,pos[1])==3||gt(pos[0],pos[1]+9)==3||gt(pos[0]+9,pos[1]+9)==3){pos=[sp[0]*10,sp[1]*10];frames=0}
  if(pos[0]>=ep[0]*10-10&&pos[0]<=ep[0]*10+10){
      if(pos[1]>=ep[1]*10-10&&pos[1]<=ep[1]*10+10){
        kd=[0,0,0];if(isCustom){alert("Custom level complete!");}
        else{alert("Completed: "+names[maps.indexOf(select)]);}
        changeMap();}}
  cycle();
  fill_rect(ep[0]*10,ep[1]*10,10,10,[r,g,b]);
  regen(Math.floor(temp[0]/10),Math.floor((temp[1])/10));
  regen(Math.ceil(temp[0]/10),Math.floor((temp[1])/10));
  regen(Math.floor(temp[0]/10),Math.ceil((temp[1])/10));
  regen(Math.ceil(temp[0]/10),Math.ceil((temp[1])/10));
  fill_rect(pos[0],pos[1],10,10,plc);
  requestAnimationFrame(loop);
}
loop();
document.addEventListener("keydown",function(e){
  for(let i=0;i<3;i++){
    if(e.code==["KeyA","KeyW","KeyD"][i]){
      kd[i]=1;
}}});
document.addEventListener("keyup",function(e){
  for(let i=0;i<3;i++){
    if(e.code==["KeyA","KeyW","KeyD"][i]){
      kd[i]=0;
}}});
document.querySelector("#plc").addEventListener("change",function(){
  plc=document.getElementById("plc").value;
});
</script>
